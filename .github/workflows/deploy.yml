name: Deploy to Cloudflare Workers

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npm run build
      - run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      # Avisa a Bing y Yandex que el sitio cambio (IndexNow).
      # Bing alimenta el indice que usa ChatGPT Search, por eso importa.
      - name: Notificar a IndexNow
        run: node scripts/indexnow.mjs
        continue-on-error: true
